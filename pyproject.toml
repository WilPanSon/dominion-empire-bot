[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dominion-empire-bot"
version = "0.1.0"
description = "A deterministic Dominion: Empires simulator and masked self-play PPO bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rl = ["numpy>=1.26", "torch>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
dominion-bot = "dominion_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
